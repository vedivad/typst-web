name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the version PR and git tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/typsten

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The wasm-opt pass in build:wasm:opt dominates wall-clock (minutes) while
      # the compile is seconds. Its output is a pure function of the Rust sources,
      # the locked deps, and the toolchain, so cache the built pkg/ keyed on those.
      # JS/doc-only releases (the common case) restore it and skip the build.
      - name: Capture rustc version
        id: rustc
        run: echo "version=$(rustc --version | tr ' ()' '___')" >> "$GITHUB_OUTPUT"

      - name: Cache built wasm (pkg/)
        id: wasm-pkg
        uses: actions/cache@v4
        with:
          path: packages/typsten/pkg
          key: typsten-pkg-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('packages/typsten/src/**', 'packages/typsten/Cargo.toml', 'packages/typsten/Cargo.lock') }}

      # On a cache miss this builds and the cache action saves pkg/ in its post
      # step. On a hit the optimized wasm is already restored, so wasm-opt (the
      # slow part) is skipped entirely.
      - name: Build wasm
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        run: bun run build:wasm:opt

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun run test

      # If there are changesets, opens/updates a "Version Packages" PR.
      # If there are none (that PR was merged), runs the `release` script to
      # publish. Changesets replaces the `workspace:` ranges with real versions.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
