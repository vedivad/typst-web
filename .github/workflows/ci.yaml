name: CI

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

jobs:
  # Single job: the Rust to wasm build dominates wall-clock and the JS build and
  # tests depend on its output, so building once and reusing it beats fanning
  # out into parallel jobs that each rebuild the wasm.
  build-and-test:
    runs-on: ubuntu-latest
    name: Build, check, test
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/typsten

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Debug wasm build (no wasm-opt): correctness is identical to build:wasm:opt,
      # only the output size differs, so PR CI skips the slow optimization pass.
      - name: Build wasm
        run: bun run build:wasm

      - name: Build packages
        run: bun run build

      - name: Format & lint
        run: bun run check

      - name: Run tests
        run: bun run test
