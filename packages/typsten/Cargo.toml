[package]
name = "typsten"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = "0.14.2"
comemo = "0.5"
parking_lot = "0.12"
typst-ide = "0.14.2"
typst-svg = "0.14.2"
typst-pdf = "0.14.2"
typstyle-core = "0.14.4"
typst-assets = { version = "0.14.2", features = ["fonts"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int"]
